<body>
<header id="mast">
  <svg id="clock" class="clock" viewBox="0 0 60 60" aria-hidden="true"><g id="spokes" stroke="currentColor" stroke-width="1.4"></g><line id="hh" x1="30" y1="30" x2="30" y2="18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line id="mh" x1="30" y1="30" x2="30" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="30" cy="30" r="2.8" fill="#d97757"/></svg>
  <div><div class="kicker">work · brain · card file</div><h1>Ca<em>rds</em></h1></div>
  <div id="views" class="pills"><button class="on" data-view="cards">Cards<b id="nblock" hidden></b></button><button data-view="pipeline">Pipeline</button><button data-view="stats">Stats</button><button data-view="board">Board</button><button data-view="files">Files</button></div>
  <div id="listen" role="status" hidden></div>
  <div id="count" class="count"></div>
  <button id="wind" title="End of day: close every lead and tell the dispatcher to stop its helpers">Wind down</button>
</header>
<nav id="list"><button id="rail" aria-label="Toggle card list" aria-pressed="false" title="Collapse the card list so the pane spans the window">‹</button><div id="new"><button id="newbtn" aria-expanded="false">+ New card</button>
  <form id="newform" hidden>
    <fieldset><legend>What kind of work?</legend>
      <label class="pick"><input type="radio" name="type" value="feature" checked><span class="ty ty-feature">Feature</span></label>
      <label class="pick"><input type="radio" name="type" value="review"><span class="ty ty-pr">PR review</span></label>
      <label class="pick"><input type="radio" name="type" value="research"><span class="ty ty-research">Research</span></label>
    </fieldset>
    <input type="text" name="title" maxlength="80" required aria-label="Title" placeholder="Title, e.g. TICKET-123 retry button">
    <textarea name="details" rows="3" maxlength="2000" aria-label="Details" placeholder="Details, a link, what done looks like (optional)"></textarea>
    <div class="row"><button type="submit">Raise it</button><button type="button" id="newcancel">Cancel</button><span class="err" role="alert"></span></div>
  </form></div><div id="cards"></div></nav>
<section id="pipeline" hidden></section>
<section id="stats" hidden></section>
<section id="board" hidden></section>
<section id="files" hidden><nav id="tree"></nav><div id="fpane"></div></section>
<main id="right">
  <div id="head"><div id="hd"><div class="empty">Loading…</div></div></div>
  <div id="tabs"></div>
  <div id="pane"></div>
</main>
<script>
const TABS = [['card', 'Card'], ['docs', 'Brief / Plan'], ['diff', 'Diff'], ['diagram', 'Diagram'], ['shots', 'Before / After']];
// list order, from routes.cards (STATE_ORDER); closed sits behind its own link
const GROUPS = [['needs you', 'Needs you'], ['working', 'Working'], ['waiting on someone else', 'Waiting on someone else'], ['done', 'Done, close when ready'], ['parked', 'Parked']];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Task files can carry text from outside (a PR title, a colleague's comment): raw HTML is shown as text and only
// http(s) links stay links.
marked.use({ renderer: {
  html: (token) => esc(token.text),
  link(token) { return /^https?:\/\//i.test(token.href) ? false : this.parser.parseInline(token.tokens); },
} });
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const mm = dark ? { bg:'#2b1f19', fg:'#f1e7d5', line:'#cfbda4', soft:'#261a15', paper:'#1d1410', rule:'#43322a' } : { bg:'#fbf5e8', fg:'#2b1d15', line:'#5a4536', soft:'#e8dac2', paper:'#f3e9d7', rule:'#d6c3a6' };
mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: { fontFamily: 'Jost, sans-serif', primaryColor: mm.bg, primaryTextColor: mm.fg,
  primaryBorderColor: mm.fg, lineColor: mm.line, secondaryColor: mm.soft, tertiaryColor: mm.paper, clusterBkg: mm.soft, clusterBorder: mm.rule, edgeLabelBackground: mm.paper } });

const fromHash = TABS.find(([k]) => k === location.hash.slice(1));
// drafts: half-typed answers by `<folder>:<id>`; why / typing: open "why" paragraphs and answer boxes by the same key
const state = { rows: [], sel: null, view: 'cards', showClosed: false, drafts: {}, why: new Set(), typing: new Set(), earlier: new Set(), prEl: null, chat: {}, chatPoll: {},
  pipeline: { rows: [], parked: [] }, stats: { cards: [], recent: false, open: {} }, tab: fromHash ? fromHash[0] : 'card', doc: null, task: null, diff: {} };

function copyFrom(b, pre) {
  const select = () => { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected'; };
  if (!navigator.clipboard) return select(); // http on a non-localhost host: no clipboard API
  navigator.clipboard.writeText(pre.textContent).then(() => { b.textContent = 'Copied'; }, select);
}
// Copy a markdown file's source, as written, from the Docs and Files views.
const copyMd = (b, text) => {
  if (!navigator.clipboard) { b.textContent = 'No clipboard here'; return; }
  navigator.clipboard.writeText(text).then(() => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy markdown'; }, 1500); }, () => { b.textContent = 'Copy failed'; });
};
function wireCopy(pane) {
  for (const b of pane.querySelectorAll('.ship .copy')) b.onclick = () => copyFrom(b, b.nextElementSibling);
}

// The [PR] card (mockup variant C), laid out from `row.pr` (pr.md as parsed by routes.cards). Plain DOM calls:
// everything that comes from pr.md, the draft comment or the card lands as textContent, never as HTML.
const el = (tag, cls, text, kids = []) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; n.append(...kids); return n; };
const REVIEWS = [['approve', 'Approve'], ['request-changes', 'Request changes'], ['comment', 'Comment']];
const isWeb = (url) => /^https?:\/\//.test(url || '');
const webLink = (url, text) => Object.assign(el('a', '', text), { href: url, target: '_blank', rel: 'noopener' });
// The one next action for where the PR stands: post (GitHub) / refused (run the command by hand) / requested (Post stamped,
// not answered yet) / posted (pasted by hand) / done / rereview / none (a review is running).
function prAction(item) {
  const { stands } = item.pr;
  if (stands === 'merged' || stands === 'closed') return 'done';
  if (item.post !== 'none') return !item.postable ? 'posted' : { refused: 'refused', requested: 'requested' }[item.post] || 'post';
  return stands === 'reviewing' || stands === 're-reviewing' ? 'none' : 'rereview';
}
// The stamps a PR's card offers under its Needs you block, which does not already offer them.
const prTray = (item) => (!item.pr ? ['Done'] : { done: ['Changes'], post: ['Changes', 'Re-review', 'Done'], refused: ['Changes', 'Re-review', 'Done'], posted: ['Changes', 'Re-review', 'Done'] }[prAction(item)] || ['Changes', 'Done']);
const fold = (title, body) => el('details', 'fold', null, [el('summary', '', title), el('div', 'in', null, [body])]);

function prCard(item) {
  const pr = item.pr;
  if (!pr) return el('div', 'card-secs prcard', null, [el('div', 'raw', item.title), el('div', 'empty', 'pr.md missing')]);
  const action = prAction(item);
  const posting = action === 'post' || action === 'posted' || action === 'refused';
  const stampBtn = (label, body, calm) => Object.assign(el('button', `stampbtn${calm ? ' calm' : ''}`, label), { onclick: () => prStamp(body(), label) });

  const standing = el('p', 'standing', null, [
    el('span', `chip ${action === 'done' ? 't-done' : posting ? 't-needs' : 't-wait'}`, pr.stands || 'unknown'),
    el('span', 'meta', `round ${pr.round ?? '?'}`),
    ...(isWeb(pr.url) ? [webLink(pr.url, 'open the PR ↗')] : []),
  ]);

  // the draft comment: raw markdown fetched as text through the task-file route, shown in a <pre>
  const pre = el('pre', '', pr.comment.path ? 'Loading…' : '');
  const copy = Object.assign(el('button', 'copy', 'Copy'), { disabled: true });
  const handCopy = Object.assign(el('button', 'act', 'Copy comment'), { disabled: true, onclick: () => copyFrom(handCopy, pre) });
  const rel = (pr.comment.path || '').replace(`tasks/${item.folder}/`, '');
  if (rel) fetch(`/api/task-file?folder=${encodeURIComponent(item.folder)}&path=${encodeURIComponent(rel)}`)
    .then((r) => (r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`))))
    .then((text) => { pre.textContent = text; copy.disabled = handCopy.disabled = false; }, (e) => { pre.textContent = `Could not load ${rel}: ${e.message}`; });

  const needs = el('div', `needs${action === 'done' ? ' done' : posting ? '' : ' wait'}`, null, [el('div', 'sec', posting || action === 'done' ? 'Needs you' : 'Needs you · nothing')]);
  if (posting) {
    pr.decisions.forEach((d, n) => {
      needs.append(el('p', 'dq', d.question));
      for (const o of d.options) {
        const radio = Object.assign(el('input'), { type: 'radio', name: `prd${n}`, value: o.letter, checked: o.letter === (d.chosen || d.default) });
        needs.append(el('label', 'opt', null, [radio, el('span', 'k', o.letter), el('span', '', null, [el('span', 'what', o.text)]), o.letter === d.default ? el('span', 'deftag', 'default') : el('span')]));
      }
    });
    const picked = () => Object.fromEntries(pr.decisions.map((d, n) => [d.question, needs.querySelector(`input[name="prd${n}"]:checked`)?.value]).filter(([, letter]) => letter));
    if (action === 'post') {
      const as = el('select', '', null, REVIEWS.map(([value, label]) => Object.assign(el('option', '', label), { value })));
      const said = (pr.verdict || '').toLowerCase();
      as.value = said.startsWith('approve') ? 'approve' : said.startsWith('request changes') ? 'request-changes' : 'comment';
      as.setAttribute('aria-label', 'Post as');
      // the draft was written for the defaults: another option is a rewrite, not a post
      const hint = el('span', 'hint');
      const say = () => { const p = picked(); hint.textContent = pr.decisions.some((d) => p[d.question] && p[d.question] !== d.default) ? 'picking a non-default option sends the comment back for a rewrite first' : 'posts the draft comment under your sign-in'; };
      needs.addEventListener('change', say);
      needs.append(el('div', 'acts', null, [stampBtn('Post', () => ({ answer: 'Post', review: as.value, decisions: picked() })), as, hint]));
      say();
    } else if (action === 'refused') {
      // the session could not post: the newest `! ` timeline entry is the line to run by hand
      needs.append(el('p', 'took', 'The post was refused in the dispatcher session. Run this there yourself:'), el('div', 'ship', null, [el('button', 'copy', 'Copy'), el('pre', '', pr.timeline.find((t) => t.text.startsWith('! ')).text)]));
    } else {
      needs.append(el('div', 'acts', null, [handCopy, stampBtn('Posted', () => ({ answer: 'Posted', decisions: picked() })), el('span', 'hint', 'not a GitHub PR: paste the comment there, then stamp')]));
    }
  } else if (action === 'done') {
    needs.append(el('p', 'took', `${pr.stands === 'merged' ? 'Merged' : 'Closed'}. One last stamp clears the card.`), el('div', 'acts', null, [stampBtn('Done', () => ({ answer: 'Done' }))]));
  } else if (action === 'rereview') {
    const queued = pr.stands === 're-review queued';
    needs.append(el('p', 'took', queued ? 'Nothing right now. The next round starts by itself when a worktree is free.' : 'Nothing right now.'),
      el('div', 'acts', null, [stampBtn('Re-review now', () => ({ answer: 'Re-review' }), true), ...(queued ? [el('span', 'hint', 'jumps the queue')] : [])]));
  } else {
    needs.append(el('p', 'took', action === 'requested' ? 'Post requested, waiting on the dispatcher.' : 'Nothing right now. A review is running.'));
  }

  const left = pr.todo.filter((t) => !t.done).length;
  const file = rel || 'none yet';
  return el('div', 'card-secs prcard', null, [
    standing,
    el('p', 'verdict', pr.verdict || 'No verdict yet.'),
    needs,
    fold(`What still needs doing (${left})`, pr.todo.length ? el('ul', 'look', null, pr.todo.map((t) => el('li', t.done ? 'did' : '', t.text))) : el('p', 'took', 'Nothing left.')),
    fold(`Comment · ${pr.comment.posted ? 'posted' : 'draft'} · ${file}`, rel
      ? el('div', '', null, [el('div', 'ship', null, [copy, pre]), ...(pr.comment.posted ? [el('p', 'took', 'Posted: ', [isWeb(pr.comment.posted) ? webLink(pr.comment.posted, pr.comment.posted) : pr.comment.posted])] : [])])
      : el('p', 'took', 'No draft comment yet.')),
    fold(`Timeline (${pr.timeline.length})`, el('ol', 'tl', null, pr.timeline.map((t) => el('li', '', null, [el('span', 'ts', t.at.slice(5)), el('span', '', t.text)])))),
  ]);
}

// A stamp on a PR's card (/api/card/pr-stamp). The card stays selected and re-renders from the row the route returns.
async function prStamp(body, label) {
  const row = current();
  if (!row) return;
  const buttons = document.querySelectorAll('#pane .prcard .stampbtn, #pane .prtray button');
  for (const b of buttons) b.disabled = true;
  try {
    const next = await api('/api/card/pr-stamp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task: row.folder, ...body }) });
    delete state.drafts[`${row.folder}:pr`];
    state.prEl = null;
    stamp(label);
    updateRow(next);
  } catch (e) {
    cardMsg(e.message);
    for (const b of buttons) b.disabled = false;
  }
}

// ---- the card list ----
const current = () => state.rows.find((r) => r.folder === state.sel) || null;
const openCount = (r) => r.questions.length + r.queued;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const day = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? `${MON[Number(m[2]) - 1]} ${Number(m[3])}` : String(d || ''); };

const tyClass = (r) => `ty-${String(r.type || 'Feature').toLowerCase().split(' ')[0]}`;
const tyTag = (r) => `<span class="ty ${tyClass(r)}">${esc(r.type || 'Feature')}</span>`;
// Agent and gate marks: a filled dot = someone is on the card now, a filled diamond = it waits at that gate.
const LEAD_MARK = { replying: ['on', 'Lead working'], idle: ['on', 'Lead attached'], 'waiting on you': ['stuck', 'Lead waiting on you'], asleep: ['', 'Lead asleep'] };
function marksHtml(r) {
  const out = [];
  const a = r.agent || { lead: 'none', helpers: 0 };
  if (LEAD_MARK[a.lead]) out.push(`<span class="mk ${LEAD_MARK[a.lead][0]}">${LEAD_MARK[a.lead][1]}</span>`);
  if (a.helpers > 0) out.push(`<span class="mk on">${plural(a.helpers, 'helper', 'helpers')} working</span>`);
  if (!out.length) out.push('<span class="mk">No agent</span>');
  if (r.gate) out.push(`<span class="mk gate${r.gate.at ? ' at' : ''}">${r.gate.at ? 'At gate' : 'Next gate'}: ${esc(r.gate.name)}</span>`);
  return `<div class="marks">${out.join('')}</div>`;
}
const listItem = (r) => {
  const need = r.state === 'needs you';
  const sub = need
    ? (openCount(r) ? `needs you: ${plural(openCount(r), 'answer', 'answers')}` : 'needs you')
    : r.where || (r.unreadable ? 'card.json could not be read' : '');
  return `<div class="item ${tyClass(r)} st-${esc(r.state.split(' ')[0])}${r.folder === state.sel ? ' sel' : ''}" data-folder="${esc(r.folder)}">
      <div class="ltitle">${tyTag(r)}${esc(r.title)}</div>
      ${sub ? `<div class="lsub${need ? ' need' : ''}">${esc(sub)}</div>` : ''}
      ${marksHtml(r)}
      <div class="lmeta">${esc(r.folder)}</div></div>`;
};

function renderList() {
  const needs = state.rows.filter((r) => r.state === 'needs you').length;
  const closed = state.rows.filter((r) => r.state === 'closed');
  const open = state.rows.length - closed.length;
  document.title = (needs ? `(${needs}) ` : '') + 'work-brain cards';
  $('#count').textContent = open ? `${needs} need you · ${open} open` : 'all clear';
  $('#nblock').textContent = needs; $('#nblock').hidden = !needs;
  const showClosed = state.showClosed || current()?.state === 'closed'; // the open card never drops out of view
  $('#cards').innerHTML = GROUPS.map(([key, title]) => {
    const rows = state.rows.filter((r) => r.state === key);
    if (!rows.length && key !== 'needs you') return '';
    return `<h2>${esc(title)} (${rows.length})</h2>${rows.map(listItem).join('') || '<div class="empty">Nothing needs you.</div>'}`;
  }).join('')
    + (closed.length ? `<button class="closedlink" aria-expanded="${showClosed}">Closed (${closed.length}) ${showClosed ? '▾' : '▸'}</button>${showClosed ? closed.map(listItem).join('') : ''}` : '');
  for (const n of document.querySelectorAll('#cards .item')) n.onclick = () => select(n.dataset.folder);
  const link = $('#cards .closedlink');
  if (link) link.onclick = () => { state.showClosed = !showClosed; renderList(); };
  $('#cards .item.sel')?.scrollIntoView({ block: 'nearest' });
}

async function select(folder) {
  state.sel = folder; state.doc = null; state.task = null; state.prEl = null;
  renderList();
  const row = current();
  if (!row) {
    $('#hd').innerHTML = '<div class="empty">No cards.</div>'; $('#tabs').innerHTML = ''; $('#pane').innerHTML = '';
    return;
  }
  $('#hd').innerHTML = `${tyTag(row)}<div class="task">${esc(row.folder)}${row.lane ? ` · ${esc(row.lane)}` : ''}${row.stage ? ` · ${esc(row.stage)}` : ''}</div>`;
  showTab(state.tab);
  try { state.task = await api(`/api/task/${encodeURIComponent(folder)}`); } catch (e) { state.task = { error: e.message, files: {}, shots: {} }; }
  if (state.sel !== folder) return; // moved on while loading
  if (state.tab !== 'card') showTab(state.tab);
}

function showTab(tab) {
  state.tab = tab; if (state.view === 'cards') history.replaceState(null, '', `#${tab}`);
  $('#tabs').innerHTML = TABS.map(([k, label]) => `<button class="${k === tab ? 'on' : ''}" data-tab="${k}">${label}</button>`).join('');
  for (const b of document.querySelectorAll('#tabs button')) b.onclick = () => showTab(b.dataset.tab);
  const pane = $('#pane');
  const row = current();
  if (!row) return;
  if (tab === 'card') return renderCard(pane, row);
  const t = state.task;
  if (!t) return (pane.innerHTML = '<div class="empty">Loading…</div>');
  if (t.error) return (pane.innerHTML = `<div class="empty">Could not load task: ${esc(t.error)}</div>`);
  if (tab === 'docs') return renderDocs(pane, t);
  if (tab === 'diff') return renderDiff(pane, t.repo);
  if (tab === 'diagram') return renderDiagram(pane, t.diagram);
  if (tab === 'shots') {
    const { before, after } = t.shots;
    pane.innerHTML = before || after
      ? `<div class="shots"><div><h3>Before</h3>${before ? `<img src="${before}" alt="before">` : '<div class="empty">none</div>'}</div>
         <div><h3>After</h3>${after ? `<img src="${after}" alt="after">` : '<div class="empty">none</div>'}</div></div>`
      : '<div class="empty">No UI change recorded</div>';
  }
}

function renderDocs(pane, t) {
  const names = Object.keys(t.files);
  if (!names.includes(state.doc)) state.doc = names[0] || null;
  pane.innerHTML = `<div class="pills">${names.map((n) => `<button class="${n === state.doc ? 'on' : ''}" data-doc="${esc(n)}">${esc(n)}</button>`).join('')}${(t.others || []).map((n) => `<span class="other">${esc(n)}</span>`).join('')}${state.doc ? '<button class="copymd">Copy markdown</button>' : ''}</div>
    <div class="md">${state.doc ? marked.parse(t.files[state.doc]) : '<div class="empty">No markdown files in this task folder.</div>'}</div>`;
  for (const b of pane.querySelectorAll('.pills button[data-doc]')) b.onclick = () => { state.doc = b.dataset.doc; renderDocs(pane, t); };
  const copy = pane.querySelector('.copymd');
  if (copy) copy.onclick = () => copyMd(copy, t.files[state.doc]);
}

// ---- the open card ----
// A task file named on the card: .md opens in the Brief / Plan viewer here, anything else (a mockup) in a new tab.
const fileLink = (folder, file, text) => (/\.md$/i.test(file)
  ? `<button class="link" data-doc="${esc(file)}">${esc(text)}</button>`
  : `<a class="link" href="/api/task-file?folder=${encodeURIComponent(folder)}&path=${encodeURIComponent(file)}" target="_blank" rel="noopener">${esc(text)}</a>`);

function packetHtml(p) {
  if (!p) return '<div class="packet"><p class="warn">packet.md is missing: there is nothing to run.</p></div>';
  return `<div class="packet">${p.title ? `<h4>${esc(p.title)}</h4>` : ''}
    ${p.look.length ? `<div class="sec">Look</div><ul class="look md">${p.look.map((l) => `<li>${marked.parseInline(l)}</li>`).join('')}</ul>` : ''}
    ${p.ship ? `<div class="sec">Ship</div><div class="ship"><button class="copy">Copy</button><pre>${esc(p.ship)}</pre></div>` : '<p class="warn">packet.md has no Ship block: Approve runs nothing.</p>'}</div>`;
}

const answerBox = (key, label) => `<div class="answerrow"><textarea data-draft="${esc(key)}" placeholder="${esc(label)}">${esc(state.drafts[key] || '')}</textarea><button class="act" data-send="${esc(key)}">Send</button></div>`;

// A finished research card: the next move is the manager's. Each button answers the question with its own words
// (/cards step 3 tells the dispatcher what each one starts); two of them need the note.
const NEXT = [['Dig further', 'What to dig into'], ['Build it'], ['Write tickets'], ['Draft a message', 'Who it is for']];
function nextHtml(row, x, n) {
  const key = `${row.folder}:${x.id}`;
  return `<li class="q" data-id="${esc(x.id)}">
    <div class="qt">${n}. ${esc(x.q)}</div>
    <div class="answerrow"><textarea data-draft="${esc(key)}" placeholder="Note: what to dig into, or who the message is for">${esc(state.drafts[key] || '')}</textarea></div>
    <div class="qa"><span class="qbtns">${NEXT.map(([b]) => `<button class="stampbtn" data-next="${esc(b)}" data-key="${esc(key)}">${b}</button>`).join('')}
      <button class="act" data-card="close">Nothing more: close card</button>
      ${x.file ? fileLink(row.folder, x.file, `${x.file} ▸`) : ''}</span></div>
  </li>`;
}

function questionHtml(row, x, n) {
  if (x.kind === 'next step') return nextHtml(row, x, n);
  const key = `${row.folder}:${x.id}`;
  const ship = x.kind === 'ship approval';
  const accept = ship ? (x.packet?.ship ? 'Approve: run Ship' : 'Approve') : 'Accept';
  const whyOpen = state.why.has(key);
  return `<li class="q" data-id="${esc(x.id)}">
    <div class="qt">${n}. ${esc(x.q)}</div>
    ${ship ? packetHtml(x.packet) : ''}
    <div class="qa"><span class="sug"><span class="lbl">Suggested:</span> ${esc(x.suggested || '—')}</span>
      <span class="qbtns"><button class="stampbtn" data-accept="${esc(x.id)}" ${x.suggested ? '' : 'disabled title="No suggested answer: use Other…"'}>${accept}</button>
        <button class="act" data-other="${esc(key)}">Other…</button>
        ${x.why ? `<button class="link" data-why="${esc(key)}" aria-expanded="${whyOpen}">why ${whyOpen ? '▾' : '▸'}</button>` : ''}
        ${x.file ? fileLink(row.folder, x.file, `${x.file} ▸`) : ''}</span></div>
    ${x.why && whyOpen ? `<p class="whyp">${esc(x.why)} <button class="link" data-asklead="${esc(x.id)}">ask the lead</button></p>` : ''}
    ${state.typing.has(key) ? answerBox(key, 'Your answer') : ''}
  </li>`;
}

function decidedHtml(row, d) {
  const key = `${row.folder}:${d.id}`;
  if (d.kind !== 'assumed') return `<li><span class="mk">✓</span><span class="dt">${esc(d.q)} → <b>${esc(d.answer)}</b></span><span></span><span class="date">${esc(day(d.answered))}</span></li>`;
  return `<li class="as"><span class="mk">~</span><span class="dt">Assumed: ${esc(d.q)}${d.answer !== d.q ? ` → <b>${esc(d.answer)}</b>` : ''}</span>
    <button class="act" data-change="${esc(key)}">Change</button><span class="date">${esc(day(d.answered))}</span>
    ${state.typing.has(key) ? answerBox(key, 'What should it be instead?') : ''}</li>`;
}

const DECIDED_SHOWN = 3;
function cardHtml(row) {
  const need = row.state === 'needs you';
  const n = openCount(row);
  const head = `<div class="ch"><h3 class="ctitle">${esc(row.title)}</h3>${need ? `<span class="need">${n ? `needs you: ${plural(n, 'answer', 'answers')}` : 'needs you'}</span>` : `<span class="chip t-${row.state === 'waiting on someone else' ? 'wait' : 'done'}">${esc(row.state)}</span>`}</div>`;
  if (row.unreadable) return `${head}${marksHtml(row)}<p class="line">card.json could not be read: ${esc(row.unreadable)}</p>`;
  const decided = row.decided.map((d) => decidedHtml(row, d));
  return `${head}${marksHtml(row)}
    ${row.where ? `<p class="line"><span class="lbl">Where it stands:</span> ${esc(row.where)}</p>` : ''}
    ${row.questions.length ? `<ol class="qs">${row.questions.map((x, i) => questionHtml(row, x, i + 1)).join('')}</ol>` : ''}
    ${row.queued > 0 ? `<p class="queued">+ ${row.queued} more waiting</p>` : ''}
    ${row.next && row.questions.length ? `<p class="line"><span class="lbl">After you answer:</span> ${esc(row.next)}</p>` : ''}
    ${row.later.length ? `<p class="line"><span class="lbl">Later, not blocking:</span> ${row.later.map(esc).join(' · ')}</p>` : ''}
    <div id="prslot"></div>
    ${decided.length ? `<div class="dech">Decided</div><ul class="decided">${decided.slice(0, DECIDED_SHOWN).join('')}</ul>
      ${decided.length > DECIDED_SHOWN ? `<details class="earlier"${state.earlier.has(row.folder) ? ' open' : ''}><summary>${decided.length - DECIDED_SHOWN} earlier</summary><ul class="decided">${decided.slice(DECIDED_SHOWN).join('')}</ul></details>` : ''}` : ''}`;
}

function actionsHtml(row) {
  const f = esc(row.folder);
  const result = row.result ? fileLink(row.folder, row.result, 'Read the result ▸').replace('class="link"', 'class="link readres"') : '';
  const btns = row.state === 'closed'
    ? `<button class="act" data-card="reopen">Reopen</button>`
    : `${row.state === 'parked' ? `<button class="act" data-act="unpark" data-folder="${f}">Unpark</button>` : `<button class="act" data-act="park" data-folder="${f}">Park</button>`}
       <button class="act drop" data-act="drop" data-folder="${f}">Drop</button><button class="act" data-card="close">Close card</button>`;
  return `<div class="cacts">${result}<span class="sp"></span>${btns}</div><div class="cmsg" role="alert"></div>`;
}

// The PR pane inside the card, plus the stamps its Needs you block does not offer. Reused while pr.md is unchanged so picked options survive a re-render.
function prSection(row) {
  const key = JSON.stringify([row.folder, row.pr, row.post, row.postable]);
  if (state.prEl?.key === key) return state.prEl.el;
  const draftKey = `${row.folder}:pr`;
  const note = Object.assign(el('input'), { placeholder: 'Note (needed for Changes)', value: state.drafts[draftKey] || '' });
  note.dataset.draft = draftKey;
  const tray = el('div', 'prtray', null, [note, ...prTray(row).map((b) => Object.assign(el('button', 'act', b === 'Changes' ? 'Changes…' : b), { onclick: () => {
    const text = note.value.trim();
    if (b === 'Changes' && !text) { cardMsg('Changes needs a note'); return note.focus(); }
    prStamp({ answer: text ? `${b}: ${text}` : b }, b);
  } }))]);
  const box = el('div', '', null, [prCard(row), tray]);
  state.prEl = { key, el: box };
  return box;
}

function cardMsg(text) { const m = $('#pane .cmsg'); if (m) m.textContent = text; }

function renderCard(pane, row) {
  const focused = document.activeElement?.dataset?.draft; // keep the cursor in a half-typed answer across a re-render
  const top = pane.scrollTop;
  pane.innerHTML = `<div class="cardv">${cardHtml(row)}<section class="chat" data-task="${esc(row.folder)}"></section>${actionsHtml(row)}</div>`;
  if (row.pr !== undefined) $('#prslot')?.replaceWith(prSection(row));
  paintChat(row.folder);
  pane.scrollTop = top;
  wireCopy(pane);
  wireActions(pane);
  for (const b of pane.querySelectorAll('[data-accept]')) b.onclick = () => {
    const x = row.questions.find((q) => q.id === b.dataset.accept);
    answerQ(row, x.id, x.suggested, x.kind === 'ship approval' ? 'Approved' : 'Accepted');
  };
  const toggle = (set, key) => { set.has(key) ? set.delete(key) : set.add(key); renderCard(pane, current()); };
  for (const b of pane.querySelectorAll('[data-why]')) b.onclick = () => toggle(state.why, b.dataset.why);
  for (const b of pane.querySelectorAll('[data-asklead]')) b.onclick = () => {
    const x = row.questions.find((q) => q.id === b.dataset.asklead);
    state.drafts[`${row.folder}:chat`] = `About "${x.q}": `;
    paintChat(row.folder);
    const t = pane.querySelector('textarea[data-draft$=":chat"]');
    if (t) { t.focus(); t.selectionStart = t.selectionEnd = t.value.length; }
  };
  for (const b of pane.querySelectorAll('[data-other], [data-change]')) b.onclick = () => {
    const key = b.dataset.other || b.dataset.change;
    toggle(state.typing, key);
    pane.querySelector(`textarea[data-draft="${CSS.escape(key)}"]`)?.focus();
  };
  for (const t of pane.querySelectorAll('[data-draft]')) t.oninput = () => { state.drafts[t.dataset.draft] = t.value; };
  for (const b of pane.querySelectorAll('[data-send]')) b.onclick = () => {
    const key = b.dataset.send, text = (state.drafts[key] || '').trim();
    if (!text) return pane.querySelector(`textarea[data-draft="${CSS.escape(key)}"]`)?.focus();
    const id = key.slice(row.folder.length + 1);
    const change = row.decided.some((d) => d.id === id);
    answerQ(row, id, text, change ? 'Changed' : 'Sent', change);
  };
  for (const b of pane.querySelectorAll('[data-next]')) b.onclick = () => {
    const key = b.dataset.key, note = (state.drafts[key] || '').trim();
    const needs = NEXT.find(([n]) => n === b.dataset.next)[1];
    if (needs && !note) { cardMsg(`${b.dataset.next} needs a note: ${needs.toLowerCase()}`); return pane.querySelector(`textarea[data-draft="${CSS.escape(key)}"]`)?.focus(); }
    answerQ(row, key.slice(row.folder.length + 1), note ? `${b.dataset.next}: ${note}` : b.dataset.next, b.dataset.next);
  };
  for (const b of pane.querySelectorAll('[data-doc]')) b.onclick = () => { state.doc = b.dataset.doc; showTab('docs'); };
  for (const b of pane.querySelectorAll('[data-card]')) b.onclick = () => closeOrReopen(row, b.dataset.card);
  const earlier = pane.querySelector('details.earlier');
  if (earlier) earlier.ontoggle = () => { earlier.open ? state.earlier.add(row.folder) : state.earlier.delete(row.folder); };
  if (focused) {
    const t = pane.querySelector(`[data-draft="${CSS.escape(focused)}"]`);
    if (t) { t.focus(); t.selectionStart = t.selectionEnd = t.value.length; }
  }
}

// --- chat with the card's lead (a herdr agent); its replies land in the same thread through a Stop hook ---
const LEAD_WORDS = { none: 'no lead yet', replying: 'lead is replying…', 'waiting on you': 'lead is waiting on you', idle: 'lead is idle' };
function chatHtml(folder, c) {
  const key = `${folder}:chat`;
  const lines = c.lines.map((l) => `<li class="${l.who === 'lead' ? 'lead' : ''}"><span class="who">${esc(l.who)}</span><span class="date">${esc(l.ts)}</span>${esc(l.text)}</li>`).join('');
  return `<div class="dech">Chat with the lead</div>
    ${lines ? `<ul class="thread">${lines}</ul>` : ''}
    <div class="answerrow"><textarea data-draft="${esc(key)}" placeholder="Message the lead on this card">${esc(state.drafts[key] || '')}</textarea><button class="act" data-chatsend>Send</button></div>
    <div class="leadrow"><span>${esc(LEAD_WORDS[c.lead] || c.lead)}</span>
      ${c.lead && c.lead !== 'none' ? '<button class="link" data-golead>Go to lead</button>' : ''}
      ${c.error ? `<span class="failed">Not sent: ${esc(c.error)}</span><button class="act" data-retry>Retry</button>` : ''}</div>`;
}
// Fill the open card's chat section from state.chat, fetching the thread the first time; keeps a half-typed message and its cursor.
function paintChat(folder) {
  const sec = $('#pane section.chat');
  if (!sec || sec.dataset.task !== folder) return;
  const c = state.chat[folder];
  if (!c) { sec.innerHTML = '<div class="dech">Chat with the lead</div><p class="line">Loading…</p>'; loadChat(folder); return; }
  const focused = document.activeElement?.dataset?.draft;
  sec.innerHTML = chatHtml(folder, c);
  const box = sec.querySelector('textarea');
  box.oninput = () => { state.drafts[`${folder}:chat`] = box.value; };
  sec.querySelector('[data-chatsend]').onclick = () => sendChat(folder, '/api/card/chat', (state.drafts[`${folder}:chat`] || '').trim());
  const go = sec.querySelector('[data-golead]');
  if (go) go.onclick = () => api('/api/card/lead/focus', post({ task: folder })).catch((e) => cardMsg(e.message));
  const retry = sec.querySelector('[data-retry]');
  if (retry) retry.onclick = () => sendChat(folder, '/api/card/chat/retry');
  if (focused === box.dataset.draft) { box.focus(); box.selectionStart = box.selectionEnd = box.value.length; }
}
const post = (body) => ({ method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
function setChat(folder, c) {
  state.chat[folder] = c;
  paintChat(folder);
  // every 3 s while the lead is replying, until its answer lands
  clearTimeout(state.chatPoll[folder]);
  if (c.lead === 'replying') state.chatPoll[folder] = setTimeout(() => loadChat(folder), 3000);
}
async function loadChat(folder) {
  try {
    const d = await api(`/api/card/thread?task=${encodeURIComponent(folder)}`);
    setChat(folder, { ...d, error: d.lines.at(-1)?.who === 'Manager' ? state.chat[folder]?.error : undefined }); // a reply clears a failed send
  } catch (e) { cardMsg(e.message); }
}
async function sendChat(folder, url, text) {
  if (url.endsWith('/chat') && !text) return $('#pane section.chat textarea')?.focus();
  for (const b of document.querySelectorAll('#pane section.chat button')) b.disabled = true;
  try {
    const d = await api(url, post({ task: folder, ...(text && { text }) }));
    if (text) delete state.drafts[`${folder}:chat`]; // the line is saved even when the lead was not reached
    setChat(folder, { lines: d.lines, lead: d.lead, error: d.error });
  } catch (e) {
    cardMsg(e.message);
    for (const b of document.querySelectorAll('#pane section.chat button')) b.disabled = false;
  }
}

// Swap in the row a card route returned; the card stays selected even when it changes group.
function updateRow(row) {
  if (!row) return;
  state.rows = state.rows.some((r) => r.folder === row.folder) ? state.rows.map((r) => (r.folder === row.folder ? { ...r, ...row } : r)) : [...state.rows, row];
  seenNeeds = new Set(state.rows.filter((r) => r.state === 'needs you').map((r) => r.folder));
  renderList();
  if (state.sel === row.folder && state.tab === 'card' && state.view === 'cards') renderCard($('#pane'), row);
}

async function answerQ(row, id, text, label, change = false) {
  const key = `${row.folder}:${id}`;
  const buttons = document.querySelectorAll(`#pane .q[data-id="${CSS.escape(id)}"] button, #pane .decided button`);
  for (const b of buttons) b.disabled = true;
  try {
    const next = await api('/api/card/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task: row.folder, id, answer: text, ...(change && { change: true }) }) });
    delete state.drafts[key]; state.typing.delete(key); state.why.delete(key);
    stamp(label);
    updateRow(next);
  } catch (e) {
    cardMsg(e.message);
    for (const b of buttons) b.disabled = false;
  }
}

async function closeOrReopen(row, which) {
  try {
    const next = await api(`/api/card/${which}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task: row.folder }) });
    stamp(which === 'close' ? 'Closed' : 'Reopened');
    // After a close, move on to the next open card: staying on the closed one would unfold the whole Closed list.
    const open = which === 'close' ? state.rows.filter((r) => r.state !== 'closed' || r.folder === row.folder) : [];
    const after = open[open.findIndex((r) => r.folder === row.folder) + 1] || open.find((r) => r.folder !== row.folder);
    updateRow(next);
    if (after) select(after.folder);
  } catch (e) { cardMsg(e.message); }
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}` }));
  if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j.data;
}

function colorDiff(patch) {
  return patch.split('\n').map((l) => {
    const cls = l.startsWith('diff --git') || l.startsWith('###') ? 'file'
      : l.startsWith('@@') ? 'hunk' : l.startsWith('+') && !l.startsWith('+++') ? 'add' : l.startsWith('-') && !l.startsWith('---') ? 'del' : '';
    return `<span class="${cls}">${esc(l) || ' '}</span>`;
  }).join('');
}

async function renderDiff(pane, repo) {
  if (!repo) return (pane.innerHTML = '<div class="empty">No repo resolved</div>');
  pane.innerHTML = `<div class="empty">Loading diff for ${esc(repo.name)}…</div>`;
  try {
    state.diff[repo.name] = state.diff[repo.name] || await api(`/api/diff?repo=${encodeURIComponent(repo.name)}`);
  } catch (e) { return (pane.innerHTML = `<div class="empty">Diff failed: ${esc(e.message)}</div>`); }
  if (state.tab !== 'diff') return;
  const d = state.diff[repo.name];
  pane.innerHTML = `<div class="raw">${esc(d.status)} · <code>${esc(repo.path)}</code></div>`
    + (d.patch ? `<pre class="stat">${esc(d.stat)}</pre><pre class="diff">${colorDiff(d.patch)}</pre>` : '<div class="empty">No diff</div>');
}

async function renderDiagram(pane, code, live = () => state.tab === 'diagram') {
  if (!code) return (pane.innerHTML = '<div class="empty">No diagram for this task</div>');
  try {
    if (document.fonts?.ready) await document.fonts.ready; // Jost loads with display=swap; Mermaid must measure labels in the final font
    const { svg } = await mermaid.render(`mmd${Date.now()}`, code);
    if (live()) pane.innerHTML = svg;
  } catch (e) { pane.innerHTML = `<div class="empty">Diagram failed to render: ${esc(e.message)}</div><pre>${esc(code)}</pre>`; }
}

function stamp(text) {
  const el = document.createElement('div');
  el.className = 'stamped'; el.textContent = text;
  $('#right').appendChild(el);
  return new Promise((r) => setTimeout(() => { el.remove(); r(); }, 700));
}

(function clock() {
  const pal = ['#d97757', '#d9a441', '#4f8a7e', 'currentColor'];
  $('#spokes').innerHTML = Array.from({ length: 12 }, (_, i) => {
    const a = i * Math.PI / 6, c = Math.cos(a), s = Math.sin(a);
    return `<line x1="${30 + 13 * c}" y1="${30 + 13 * s}" x2="${30 + 23 * c}" y2="${30 + 23 * s}"/><circle cx="${30 + 26 * c}" cy="${30 + 26 * s}" r="3.2" fill="${pal[i % 4]}" stroke="none"/>`;
  }).join('');
  const tick = () => {
    const d = new Date(), m = d.getMinutes(), h = (d.getHours() % 12) + m / 60;
    $('#hh').setAttribute('transform', `rotate(${h * 30} 30 30)`); $('#mh').setAttribute('transform', `rotate(${m * 6} 30 30)`);
  };
  tick(); setInterval(tick, 30000);
})();

// ping: a card that newly needs the manager since the last fetch; the first fetch only remembers.
let seenNeeds = null, audio = null;
const wakeAudio = () => { audio ||= new AudioContext(); if (audio.state === 'suspended') audio.resume(); };
addEventListener('click', wakeAudio, true); addEventListener('keydown', wakeAudio, true); // autoplay rule: audio starts on a gesture
function ping() {
  if (audio?.state !== 'running') return;
  const t = audio.currentTime, osc = audio.createOscillator(), gain = audio.createGain();
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.05, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  osc.connect(gain).connect(audio.destination);
  osc.start(t); osc.stop(t + 0.3);
}
async function fetchCards() {
  state.rows = await api('/api/cards');
  const needs = new Set(state.rows.filter((r) => r.state === 'needs you').map((r) => r.folder));
  const fresh = seenNeeds && [...needs].some((f) => !seenNeeds.has(f));
  seenNeeds = needs;
  if (fresh) ping();
}
async function loadCards() {
  await fetchCards();
  select(current()?.folder || state.rows[0]?.folder || null);
}
// On a cards event: re-fetch, keep the open card; it re-renders only when its own row changed, so half-typed text and focus stay put.
async function refreshCards() {
  const before = JSON.stringify(current());
  await fetchCards();
  renderList();
  const row = current();
  if (!row) return select(state.rows[0]?.folder || null);
  if (JSON.stringify(row) !== before && state.view === 'cards' && state.tab === 'card') renderCard($('#pane'), row);
  if (state.chat[row.folder]) loadChat(row.folder); // a lead reply touches threads/card.md, which raises a cards event
}
// per-viewer convenience: wide pane hides the card list; remembered in localStorage, which may be unavailable
const syncWide = on => { $('#rail').setAttribute('aria-pressed', String(on)); $('#rail').textContent = on ? '›' : '‹'; };
try { syncWide(document.body.classList.toggle('wide', localStorage.getItem('wide') === '1')); } catch {}
// Wind down: end of day. Leads close now; the dispatcher stops its helpers when it hears the event.
$('#wind').onclick = async () => {
  if (!confirm('Wind down for the day? Every lead closes now, a busy one included, and the dispatcher stops its helpers.')) return;
  try {
    const r = await api('/api/wind-down', { method: 'POST' });
    stamp(`Wound down: ${r.leads} lead${r.leads === 1 ? '' : 's'} closed${r.listeners ? '' : ', no dispatcher listening'}`);
  } catch (e) { alert(e.message); }
};

// + New card: The manager raises a card themselves; the server makes the task folder and the dispatcher picks it up.
const showNew = (on) => { $('#newform').hidden = !on; $('#newbtn').hidden = on; $('#newbtn').setAttribute('aria-expanded', String(on)); if (on) $('#newform [name=title]').focus(); else $('#newbtn').focus(); };
$('#newbtn').onclick = () => showNew(true);
$('#newcancel').onclick = () => showNew(false);
$('#newform').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target; const err = f.querySelector('.err'); err.textContent = '';
  try {
    const row = await api('/api/card/new', post({ type: f.elements.type.value, title: f.elements.title.value, details: f.elements.details.value }));
    f.reset(); showNew(false);
    await refreshCards(); select(row.folder);
  } catch (x) { err.textContent = x.message; }
};
$('#rail').onclick = () => { const on = document.body.classList.toggle('wide'); syncWide(on); try { localStorage.setItem('wide', on ? '1' : '0'); } catch {} };
loadCards().catch((e) => { $('#hd').innerHTML = `<div class="empty">Failed to load cards: ${esc(e.message)}</div>`; });

// Park / Unpark / Drop: the same three routes from the open card or a pipeline row
const actionButtons = (folder, parked) => (parked
  ? `<button class="act" data-act="unpark" data-folder="${esc(folder)}">Unpark</button>`
  : `<button class="act" data-act="park" data-folder="${esc(folder)}">Park</button>`)
  + `<button class="act drop" data-act="drop" data-folder="${esc(folder)}">Drop</button>`;
function wireActions(scope) {
  for (const b of scope.querySelectorAll('button.act[data-act]')) b.onclick = () => act(b.dataset.act, b.dataset.folder);
}
async function act(route, folder) {
  const bare = folder.replace(/^tasks\//, '');
  if (route === 'drop' && !confirm(`Drop ${bare}? It cannot be undone from this page; the folder stays.`)) return;
  const buttons = document.querySelectorAll(`button.act[data-folder="${CSS.escape(folder)}"]`);
  for (const b of buttons) b.disabled = true;
  try {
    await api(`/api/${route}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ task: bare }) });
    stamp(route === 'unpark' ? 'back' : route === 'drop' ? 'dropped' : 'parked');
    await refreshCards();
    if (state.view === 'pipeline') await loadPipeline();
  } catch (e) {
    cardMsg(e.message);
    for (const b of buttons) b.disabled = false;
  }
}

// one light per stage: passed lit, current pulsing, awaiting amber with its label, blocked red with the reason
const lightHtml = (st) => `<span class="light ${st.state}"><i></i>${esc(st.name)}${st.label ? ` <em>· ${esc(st.label)}</em>` : ''}</span>`;
function renderPipeline() {
  const { rows, parked } = state.pipeline;
  const row = (r) => `
    <div class="item prow">
      <div class="phead"><span class="badge lane">${esc(r.lane)}</span><strong class="card">${esc(r.card)}</strong><span class="task">${esc(r.folder)}</span>
        ${r.agentCount > 0 ? `<span class="badge agents">${r.agentCount} ${r.agentCount === 1 ? 'agent' : 'agents'}</span>` : ''}
        <div class="actions">${actionButtons(r.folder, false)}</div></div>
      <div class="lights">${r.stages.map(lightHtml).join('')}</div></div>`;
  const parkedRow = (p) => `
    <div class="item prow">
      <div class="phead"><span class="badge lane">${esc(p.lane)}</span><strong class="card">${esc(p.card)}</strong><span class="task">${esc(p.folder)}</span>
        <span class="badge stage">at ${esc(p.stage)}</span><div class="actions">${actionButtons(p.folder, true)}</div></div></div>`;
  $('#pipeline').innerHTML = `<h2>In flight (${rows.length})</h2>` + (rows.map(row).join('') || '<div class="empty">Nothing in flight.</div>')
    + (parked.length ? `<h2>Parked (${parked.length})</h2>` + parked.map(parkedRow).join('') : '');
  wireActions($('#pipeline'));
}
async function loadPipeline() {
  try { state.pipeline = await api('/api/pipeline'); renderPipeline(); }
  catch (e) { $('#pipeline').innerHTML = `<div class="empty">Failed to load pipeline: ${esc(e.message)}</div>`; }
}
setInterval(() => { if (state.view === 'cards') refreshCards().catch(() => {}); }, 30000); // a lead or helper starting or stopping does not broadcast
setInterval(() => { if (state.view === 'pipeline') loadPipeline(); }, 30000); // status.json changes alone do not broadcast

// stats: whole seconds as "1h 12m" / "12m" / "<1m"; a leading ~ marks time inferred from the next start rather than a done row
const dur = (s) => { const m = Math.round((s || 0) / 60); return s > 0 && m === 0 ? '<1m' : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
const STAGE_ORDER = ['tdd', 'review', 'verify', 'research', 'scribe', 'other'];
const DAY_MS = 24 * 60 * 60 * 1000;
// "last 24 h" keeps a card whose newest dispatch touched the last day (an open start counts as a touch via lastTs)
const recentCard = (c, now) => c.lastTs && Date.parse(c.lastTs) >= now - DAY_MS;
function renderStats() {
  const { cards, recent, open } = state.stats;
  const now = Date.now();
  const shown = recent ? cards.filter((c) => recentCard(c, now)) : cards; // the API already sorts slowest first
  const line = (label, value, cls) => `<div class="line ${cls || ''}"><span>${esc(label)}</span><span>${esc(value)}</span></div>`;
  const row = (c) => {
    const total = c.agentSeconds + c.dispatcherSeconds;
    const pct = (s) => (total ? (s / total) * 100 : 0).toFixed(1);
    const mark = c.inferredSeconds > 0 ? '~' : '';
    const roles = Object.entries(c.roles).sort((a, b) => b[1].seconds - a[1].seconds)
      .map(([agent, r]) => line(agent, `${r.count} × · ${mark}${dur(r.seconds)}`)).join('');
    const stages = STAGE_ORDER.filter((s) => c.stages[s] > 0).map((s) => line(s, `${mark}${dur(c.stages[s])}`)).join('');
    const detail = `<h3>By role</h3>${roles || '<div class="line"><span>none closed yet</span></div>'}<h3>By stage</h3>${stages || '<div class="line"><span>none closed yet</span></div>'}`
      + (c.inferredSeconds > 0 ? line('~ inferred', dur(c.inferredSeconds), 'inferred') : '');
    return `
    <div class="item srow" data-folder="${esc(c.folder)}" title="${esc(c.folder || 'dispatches that named no task folder')}">
      <div class="shead">${c.lane ? `<span class="badge lane">${esc(c.lane)}</span>` : ''}<strong class="card">${esc(c.card || c.folder || 'no task folder')}</strong>
        ${c.stage ? `<span class="badge stage">at ${esc(c.stage)}</span>` : ''}
        <span class="meta">${c.dispatches} ${c.dispatches === 1 ? 'dispatch' : 'dispatches'}${c.openCount ? ` · ${c.openCount} open` : ''}</span>
        <span class="total">${mark}${dur(total)}</span></div>
      <div class="bar"><i class="agent" style="width:${pct(c.agentSeconds)}%"></i><i class="disp" style="width:${pct(c.dispatcherSeconds)}%"></i></div>
      <div class="split"><span class="agent"><b></b>agents ${mark}${dur(c.agentSeconds)}</span><span class="disp"><b></b>between dispatches ${dur(c.dispatcherSeconds)}</span></div>
      <div class="detail" ${open[c.folder] ? '' : 'hidden'}>${detail}</div></div>`;
  };
  const tools = `<div class="stools"><span>slowest first</span><label><input type="checkbox" id="recent" ${recent ? 'checked' : ''}> last 24 h</label>
    <span class="hint">~ inferred, capped at 2 h: no done row, closed at the next start · each gap between dispatches is capped at 2 h too</span></div>`;
  $('#stats').innerHTML = tools + (shown.map(row).join('') || `<div class="empty">${cards.length ? 'Nothing in the last 24 h.' : 'No dispatches yet.'}</div>`);
  $('#recent').onchange = (e) => { state.stats.recent = e.target.checked; renderStats(); };
  for (const el of document.querySelectorAll('#stats .srow')) el.onclick = () => { state.stats.open[el.dataset.folder] = !state.stats.open[el.dataset.folder]; renderStats(); };
}
async function loadStats() {
  try { const { cards } = await api('/api/stats'); state.stats = { ...state.stats, cards }; renderStats(); }
  catch (e) { $('#stats').innerHTML = `<div class="empty">Failed to load stats: ${esc(e.message)}</div>`; }
}
setInterval(() => { if (state.view === 'stats') loadStats(); }, 30000); // done rows written by bin/dispatch do not broadcast

// mirrors sectionFor in board-lib.js: review and research cards are not ours to ship, so they get their own block
const sectionFor = (lane) => (lane === 'review' || lane === 'research' ? 'Reviews & research' : 'Our cards');
// one status list for both sections (task-log.md legend order); a section shows only the columns it has cards in
const STATUSES = ['in-progress', 'pr-open', 'merged', 'deployed', 'reviewed', 'dropped'];
const SECTIONS = ['Our cards', 'Reviews & research'];
async function loadBoard() {
  let rows;
  try { rows = await api('/api/board'); }
  catch (e) { return ($('#board').innerHTML = `<div class="empty">Failed to load board: ${esc(e.message)}</div>`); }
  $('#board').innerHTML = SECTIONS.map((name) => {
    const mine = rows.filter((r) => sectionFor(r.lane) === name);
    const cols = STATUSES.filter((s) => mine.some((r) => r.status === s)).map((s) => {
      const cards = mine.filter((r) => r.status === s).map((r) => {
        const tag = r.folder ? 'a' : 'div';
        return `<${tag} class="item card" ${r.folder ? `href="#files/${esc(r.folder)}"` : ''}>
          <span class="badge lane">${esc(r.lane)}</span>${r.openItems > 0 ? ` <span class="badge open">${r.openItems} open</span>` : ''}
          <div class="task">${esc(r.ticket)} · ${esc(r.date)}</div>
          <div class="text">${esc(r.what)}</div></${tag}>`;
      });
      return `<div class="col"><h2>${s} (${cards.length})</h2>${cards.join('')}</div>`;
    });
    return `<h2 class="section">${esc(name)}</h2><div class="cols">${cols.join('') || '<div class="empty">none</div>'}</div>`;
  }).join('');
}

async function loadFiles(p) {
  state.file = p;
  const pane = $('#fpane');
  let tree;
  try { tree = await api('/api/files'); }
  catch (e) { return ($('#tree').innerHTML = `<div class="empty">Failed to load files: ${esc(e.message)}</div>`); }
  const folder = tree.tasks.find((t) => t.folder === p);
  if (folder && folder.files[0]) p = state.file = `${p}/${folder.files[0]}`; // a board card links to its folder; open its first card
  const link = (f) => `<a href="#files/${esc(f)}" class="${f === p ? 'on' : ''}">${esc(f.split('/').pop())}</a>`;
  $('#tree').innerHTML = '<h2>Tasks</h2>' + (tree.tasks.map((t) => `<details ${p.startsWith(`${t.folder}/`) ? 'open' : ''}><summary>${esc(t.folder.slice(6))}</summary>${t.files.map((f) => link(`${t.folder}/${f}`)).join('')}</details>`).join('') || '<div class="empty">none</div>')
    + '<h2>Retros</h2>' + (tree.retros.map(link).join('') || '<div class="empty">none</div>')
    + (tree.suggestionBox ? `<h2>Suggestion box</h2>${link(tree.suggestionBox)}` : '')
    + (tree.misses ? `<h2>Misses</h2>${link(tree.misses)}` : '')
    + (tree.answers ? `<h2>Quick answers</h2>${link(tree.answers)}` : '');
  if (!p) return (pane.innerHTML = '<div class="empty">Pick a card from the drawer.</div>');
  pane.innerHTML = `<div class="empty">Loading ${esc(p)}…</div>`;
  let text;
  try { ({ text } = await api(`/api/file?path=${encodeURIComponent(p)}`)); }
  catch (e) { return (pane.innerHTML = `<div class="empty">Could not load ${esc(p)}: ${esc(e.message)}</div>`); }
  if (state.file !== p) return;
  const name = p.split('/').pop();
  pane.innerHTML = `<div class="pills"><button id="dl" title="Save the raw file">download ${esc(name)}</button>${p.endsWith('.md') ? '<button id="cpmd" class="copymd">Copy markdown</button>' : ''}</div>`
    + (p.endsWith('.mmd') ? '<div id="fbody"></div>' : `<div class="raw">${esc(p)}</div><div class="md">${marked.parse(text)}</div>`);
  $('#dl').onclick = () => save(name, text, 'text/plain'); // raw text as-is
  if ($('#cpmd')) $('#cpmd').onclick = () => copyMd($('#cpmd'), text);
  if (!p.endsWith('.mmd')) return;
  await renderDiagram($('#fbody'), text, () => state.file === p);
  const svg = state.file === p && $('#fbody svg');
  if (!svg || $('#dl-svg')) return; // failed render, or a concurrent load already added the button
  const svgName = name.replace(/\.mmd$/, '.svg');
  $('#fpane .pills').insertAdjacentHTML('beforeend', `<button id="dl-svg" title="Save the rendered diagram">download ${esc(svgName)}</button>`);
  $('#dl-svg').onclick = () => save(svgName, new XMLSerializer().serializeToString(svg), 'image/svg+xml');
}

function save(name, text, type) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}

const TITLES = { cards: 'Ca<em>rds</em>', pipeline: 'Pipe<em>line</em>', stats: 'St<em>ats</em>', board: 'Bo<em>ard</em>', files: 'Fi<em>les</em>' };
function showView(view, filePath) {
  state.view = view;
  for (const b of document.querySelectorAll('#views button')) b.classList.toggle('on', b.dataset.view === view);
  $('#mast h1').innerHTML = TITLES[view];
  $('#list').hidden = $('#right').hidden = view !== 'cards';
  for (const v of ['pipeline', 'stats', 'board', 'files']) $(`#${v}`).hidden = view !== v;
  if (view === 'pipeline') loadPipeline();
  if (view === 'stats') loadStats();
  if (view === 'board') loadBoard();
  if (view === 'files') loadFiles(filePath || '');
}
// every view change goes through the hash so #board, #files/<path> and the card tabs all deep-link the same way
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('files')) return showView('files', h.slice(6));
  if (h === 'pipeline' || h === 'stats' || h === 'board') return showView(h);
  const tab = TABS.find(([k]) => k === h);
  if (tab) state.tab = tab[0];
  showView('cards');
  if (current()) showTab(state.tab); // the card may have changed while another view was up
}
for (const b of document.querySelectorAll('#views button')) b.onclick = () => { location.hash = b.dataset.view === 'cards' ? state.tab : b.dataset.view; };
addEventListener('hashchange', route);
route();

function showListening(n) {
  const el = $('#listen');
  el.hidden = false;
  el.classList.toggle('on', n > 0);
  el.textContent = n > 0 ? 'Dispatcher listening' : 'Not listening — run /cards';
}
const events = new EventSource('/api/events');
// onopen fires on first load and on every reconnect (e.g. server restart), so the pill never goes stale
events.onopen = () => api('/api/listening').then((d) => showListening(d.listeners)).catch(() => showListening(0));
const CARD_EVENTS = ['cards', 'new', 'answer', 'close', 'reopen', 'park', 'unpark', 'drop'];
events.onmessage = (e) => {
  const { type, listeners } = JSON.parse(e.data);
  if (type === 'listening') return showListening(listeners);
  if (type === 'dispatch') { refreshCards().catch(() => {}); if (state.view === 'pipeline') loadPipeline(); if (state.view === 'stats') loadStats(); }
  else if (CARD_EVENTS.includes(type)) { refreshCards().catch(() => {}); if (state.view === 'board') loadBoard(); if (state.view === 'pipeline') loadPipeline(); }
};
</script>
